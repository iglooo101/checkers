# CI for the checkers app. Contract: specs/001-project-foundation/contracts/ci-gate.md
# "CI gate" is the only check `main` requires. `main` itself never runs CI: commits reach it by
# fast-forward after passing on their branch.

name: CI

on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the push (docs-only or code)
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "Manual run: building everything."
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main HEAD)"
          else
            base="$BEFORE"
          fi
          files="$(git diff --name-only "$base" HEAD)"
          echo "Changed files since $base:"
          echo "${files:-(none)}"
          if [[ "$(printf '%s\n' "$files" | scripts/ci/classify-changes.sh)" == code ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    name: build-and-test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    # 22–30 minutes by E6 US2; a slow runner reached 30 (CI run 40071432056, #204).
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      DESTINATION: platform=iOS Simulator,name=iPhone 17,OS=26.2
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: xcodebuild -version

      - name: Script tests
        run: scripts/tests/run.sh

      - name: Check formatting (strict)
        run: scripts/check-format.sh --strict

      - name: Build and test (warnings are errors)
        run: scripts/test.sh SWIFT_TREAT_WARNINGS_AS_ERRORS=YES GCC_TREAT_WARNINGS_AS_ERRORS=YES

      - name: Check the string catalog
        run: scripts/check-string-catalog.sh checkers/checkers/Localizable.xcstrings .build/DerivedData

      # Timing only reports (clarification Q2); a launch test that errors still fails (III.5).
      - name: Launch timing
        run: TEST_PLAN=Performance scripts/test.sh

      - name: Report launch timing
        if: always()
        run: scripts/report-launch.sh .build/TestResults/Performance.xcresult >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: .build/TestResults
          if-no-files-found: ignore

  # The computer's strength matches need a Release build, too slow for the Debug test plan
  # (specs/005-computer-opponent/contracts/computer-player.md, "Strength matches").
  engine-strength:
    name: engine-strength
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: swift --version

      - name: Strength matches and turn counts (Release)
        shell: bash
        working-directory: checkers/CheckersEngine
        run: |
          swift test -c release --filter CheckersEngineStrengthTests 2>&1 \
            | tee "$RUNNER_TEMP/strength.log"

      - name: Report the matches
        if: always()
        run: |
          grep -E '^(medium|hard) against|^Turn generator' "$RUNNER_TEMP/strength.log" \
            >> "$GITHUB_STEP_SUMMARY" || true

  gate:
    name: CI gate
    needs: [changes, build-and-test, engine-strength]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Decide
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code || 'false' }}
          BUILD: ${{ needs.build-and-test.result }}
          STRENGTH: ${{ needs.engine-strength.result }}
        run: scripts/ci/gate.sh "$CHANGES" "$CODE" "$BUILD" "$STRENGTH"
