<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Checkers</title>
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; background: #3b2415;
    color: #f3e6cc; font-family: Georgia, 'Times New Roman', serif;
  }
  :root { --cell: min(calc((100vw - 60px) / 8), calc((100vh - 220px) / 8), 60px); }
  h1 { font-weight: normal; letter-spacing: 2px; margin: 12px 0 4px; }
  #status { min-height: 24px; margin: 8px; font-size: 18px; text-align: center; }
  #board {
    display: grid; grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
    border: 10px solid #6b4426; border-radius: 6px;
    box-shadow: 0 12px 24px rgba(0,0,0,0.4);
  }
  .sq {
    width: var(--cell); height: var(--cell); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .light { background: #f1dfb9; }
  .dark  { background: #7a4a24; }
  .piece {
    width: 76%; height: 76%; border-radius: 50%; position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), inset 0 -3px 0 rgba(0,0,0,0.2);
  }
  .w { background: radial-gradient(circle at 35% 30%, #fffaf0, #d9c39a); }
  .b { background: radial-gradient(circle at 35% 30%, #6b4426, #2a1a0e); }
  .king::after { content: "\265B"; font-size: calc(var(--cell) * 0.4); }
  .w.king::after { color: #8a5a1e; }
  .b.king::after { color: #e8c46a; }
  .sel { outline: 3px solid #e8c46a; outline-offset: -3px; }
  .hint::before {
    content: ""; width: 28%; height: 28%; border-radius: 50%;
    background: rgba(232, 196, 106, 0.75);
  }
  button {
    margin-top: 12px; padding: 8px 18px; font-size: 16px; border: 0;
    border-radius: 6px; background: #f3e6cc; color: #3b2415; cursor: pointer;
  }
</style>
</head>
<body>
<h1>Checkers</h1>
<div id="status"></div>
<div id="board"></div>
<button id="restart">New game</button>

<script>
const N = 8;
let board, turn, selected, moves, winner;
const moveSound = new Audio('move.wav');
function playMove() { moveSound.currentTime = 0; moveSound.play().catch(() => {}); }

function inside(r, c) { return r >= 0 && r < N && c >= 0 && c < N; }

function dirsFor(p) {
  if (p.king) return [[1, 1], [1, -1], [-1, 1], [-1, -1]];
  return p.color === 'w' ? [[-1, 1], [-1, -1]] : [[1, 1], [1, -1]];
}

function cloneBoard(b) { return b.map(row => row.map(x => (x ? { ...x } : null))); }

function captureChains(b, r, c, p, path, caps, out) {
  let found = false;
  for (const [dr, dc] of dirsFor(p)) {
    const mr = r + dr, mc = c + dc, lr = r + 2 * dr, lc = c + 2 * dc;
    if (!inside(lr, lc)) continue;
    const mid = b[mr][mc];
    if (!mid || mid.color === p.color || b[lr][lc]) continue;
    found = true;
    const nb = cloneBoard(b);
    nb[r][c] = null;
    nb[mr][mc] = null;
    nb[lr][lc] = { ...p };
    captureChains(nb, lr, lc, p, [...path, [lr, lc]], [...caps, [mr, mc]], out);
  }
  if (!found && caps.length) out.push({ path, caps });
}

function legalMoves(b, color) {
  const captures = [];
  const steps = [];
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const p = b[r][c];
      if (!p || p.color !== color) continue;
      captureChains(b, r, c, p, [[r, c]], [], captures);
      for (const [dr, dc] of dirsFor(p)) {
        const nr = r + dr, nc = c + dc;
        if (inside(nr, nc) && !b[nr][nc]) steps.push({ path: [[r, c], [nr, nc]], caps: [] });
      }
    }
  }
  return captures.length ? captures : steps; // mandatory capture
}

function applyMove(m) {
  const [r0, c0] = m.path[0];
  const p = { ...board[r0][c0] };
  board[r0][c0] = null;
  m.caps.forEach(([r, c]) => (board[r][c] = null));
  const [rl, cl] = m.path[m.path.length - 1];
  if ((p.color === 'w' && rl === 0) || (p.color === 'b' && rl === N - 1)) p.king = true;
  board[rl][cl] = p;
}

const lastOf = m => m.path[m.path.length - 1];
const sameSq = (a, b) => a[0] === b[0] && a[1] === b[1];
const nameOf = color => (color === 'w' ? 'Light' : 'Dark');

function newGame() {
  board = [];
  for (let r = 0; r < N; r++) {
    board.push([]);
    for (let c = 0; c < N; c++) {
      const dark = (r + c) % 2 === 1;
      let p = null;
      if (dark && r < 3) p = { color: 'b', king: false };
      if (dark && r > 4) p = { color: 'w', king: false };
      board[r].push(p);
    }
  }
  turn = 'w';
  selected = null;
  winner = null;
  refreshMoves();
  render();
}

function refreshMoves() {
  moves = legalMoves(board, turn);
  if (moves.length === 0) winner = turn === 'w' ? 'b' : 'w';
}

function render() {
  const boardEl = document.getElementById('board');
  const targets = selected
    ? moves.filter(m => sameSq(m.path[0], selected)).map(lastOf)
    : [];
  boardEl.innerHTML = '';
  for (let r = 0; r < N; r++) {
    for (let c = 0; c < N; c++) {
      const sq = document.createElement('div');
      sq.className = 'sq ' + ((r + c) % 2 === 1 ? 'dark' : 'light');
      sq.dataset.r = r;
      sq.dataset.c = c;
      if (selected && sameSq(selected, [r, c])) sq.classList.add('sel');
      if (targets.some(t => sameSq(t, [r, c]))) sq.classList.add('hint');
      const p = board[r][c];
      if (p) {
        const pe = document.createElement('div');
        pe.className = 'piece ' + p.color + (p.king ? ' king' : '');
        sq.appendChild(pe);
      }
      boardEl.appendChild(sq);
    }
  }
  const status = document.getElementById('status');
  if (winner) {
    status.textContent = nameOf(winner) + ' wins!';
  } else {
    const mustCapture = moves.length && moves[0].caps.length > 0;
    status.textContent = nameOf(turn) + ' to move' + (mustCapture ? ' (capture required)' : '');
  }
}

document.getElementById('board').addEventListener('click', e => {
  if (winner) return;
  const sq = e.target.closest('.sq');
  if (!sq) return;
  const r = Number(sq.dataset.r), c = Number(sq.dataset.c);

  const chosen = selected
    ? moves.find(m => sameSq(m.path[0], selected) && sameSq(lastOf(m), [r, c]))
    : null;

  if (chosen) {
    applyMove(chosen);
    playMove();
    selected = null;
    turn = turn === 'w' ? 'b' : 'w';
    refreshMoves();
  } else if (board[r][c] && board[r][c].color === turn) {
    selected = [r, c];
  } else {
    selected = null;
  }
  render();
});

document.getElementById('restart').addEventListener('click', newGame);
newGame();
</script>
</body>
</html>
